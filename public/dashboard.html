<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambients — Analytics Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { cyan: '#38bdf8' } } } } }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/icons.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">
  <header class="w-full border-b border-white/5 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-40 px-4 lg:px-8 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>
        <span class="font-bold tracking-wider text-sm text-white">AMBIENTS <span class="text-[10px] text-slate-400">ANALYTICS</span></span>
      </div>
      <a href="/" class="text-xs text-sky-400 hover:text-sky-300 flex items-center gap-1"><i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Desk</a>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 lg:p-8 flex flex-col gap-6">
    <h1 class="text-2xl font-bold text-white mb-2">Study Analytics</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-white/10 rounded-2xl p-5 flex flex-col justify-center items-center">
        <span class="text-slate-400 text-xs uppercase tracking-wider mb-1">Total Focus Time</span>
        <span id="stat-total-time" class="text-3xl font-mono text-sky-400 font-bold">0h 0m</span>
      </div>
      <div class="bg-slate-900 border border-white/10 rounded-2xl p-5 flex flex-col justify-center items-center">
        <span class="text-slate-400 text-xs uppercase tracking-wider mb-1">Current Streak</span>
        <span id="stat-streak" class="text-3xl font-mono text-amber-400 font-bold">0 Days</span>
      </div>
      <div class="bg-slate-900 border border-white/10 rounded-2xl p-5 flex flex-col justify-center items-center">
        <span class="text-slate-400 text-xs uppercase tracking-wider mb-1">Tasks Completed</span>
        <span id="stat-tasks" class="text-3xl font-mono text-emerald-400 font-bold">0</span>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <div class="bg-slate-900 border border-white/10 rounded-2xl p-5">
        <h2 class="text-sm font-semibold text-slate-200 mb-4">Focus Trends (Last 7 Days)</h2>
        <canvas id="focusChart" height="200"></canvas>
      </div>
      <div class="bg-slate-900 border border-white/10 rounded-2xl p-5">
        <h2 class="text-sm font-semibold text-slate-200 mb-4">Task Distribution</h2>
        <canvas id="taskChart" height="200"></canvas>
      </div>
    </div>
  </main>
  
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
